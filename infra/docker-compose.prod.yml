# ================================================================
# PORMS — Docker Compose Override (Production)
# ================================================================
#
# CÁCH DÙNG (từ thư mục infra/):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# File này override các giá trị trong docker-compose.yml cho môi trường prod:
#   - Tắt volume mount source code (không hot-reload)
#   - Dùng image đã build từ registry thay vì build local
#   - Thêm Nginx reverse proxy
#   - ASPNETCORE_ENVIRONMENT = Production
# ================================================================

name: porms

services:

  # ─── Override Backend cho Production ────────────────────────────
  backend:
    build:
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS:        http://+:5000
    # Không expose port ra ngoài — Nginx sẽ proxy
    ports: []
    profiles:
      - ""   # Luôn chạy trong prod (không cần --profile app)

  # ─── Override Frontend cho Production ───────────────────────────
  frontend:
    build:
      target: runtime
      args:
        # Use the same public origin as the web app. Nginx proxies /api to
        # the backend, so browsers outside the Docker host never call
        # localhost:5000.
        VITE_API_BASE_URL: ""
        VITE_USE_MOCK_FALLBACK: "false"
    environment:
      NODE_ENV: production
    # The production frontend is only reached through the outer reverse proxy.
    # !override removes the development mapping 5173:5173.
    ports: !override []
    volumes: !override []   # Không mount source code trong prod
    profiles:
      - ""

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: porms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # Keep the familiar Vite URL for local demos, but route it through the
      # same proxy so /api requests still reach the backend.
      - "5173:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # Mount SSL certs nếu có
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - porms-net
