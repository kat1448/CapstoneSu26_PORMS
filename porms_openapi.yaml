  /api/simulation/start:
    post:
      summary: Khởi động simulation mode
      description: |-
        Replay dataset thời tiết qua toàn bộ pipeline (Risk→SOP→Mode→Alert).

        - Tất cả records tạo ra: `isSimulation = TRUE`
        - Delay giữa snapshots = `15_phút / speedMultiplier` (giây)
        - Chỉ 1 simulation active per port tại một thời điểm

        **Roles:** ADMIN, COMPANY_ADMIN
      tags:
      - Simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSimulationRequest'
      responses:
        '202':
          description: Simulation đã bắt đầu (async). Dùng GET /api/simulation/status để theo dõi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationSession'
        '400':
          description: 'Validation error — VD: speedMultiplier ngoài range, snapshots < 5'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Port đang có simulation khác đang chạy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SIMULATION_ALREADY_RUNNING
                message: Port đang có simulation đang chạy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/simulation/stop:
    post:
      summary: Dừng simulation đang chạy
      description: |-
        Set status = CANCELLED. Background task dừng sau snapshot hiện tại.

        **Roles:** ADMIN, COMPANY_ADMIN
      tags:
      - Simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sessionId
              properties:
                sessionId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationSession'
        '400':
          description: Session không ở trạng thái RUNNING
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
