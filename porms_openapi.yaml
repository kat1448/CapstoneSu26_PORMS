openapi: 3.0.3
info:
  title: PORMS API — Port Operation Risk Management System
  description: |-
    REST API for PORMS — hệ thống hỗ trợ quyết định và cảnh báo rủi ro vận hành cảng biển dựa trên dữ liệu thời tiết thời gian thực.

    **Authentication:** Bearer JWT access token trong header `Authorization: Bearer <token>`.

    **Roles:** `ADMIN` | `COMPANY_ADMIN` | `OPERATOR`

    **Data isolation:** COMPANY_ADMIN và OPERATOR chỉ thấy data của `assigned_port_id`.

    **Base URL (dev):** `http://localhost:5000`

    **Base URL (prod):** `https://api.porms.vn`
  version: 1.0.0
  contact:
    name: PORMS Team — CP_SEP490
    email: minh.npa@student.fpt.edu.vn
  license:
    name: MIT
servers:
- url: http://localhost:5000
  description: Local development
- url: https://api.porms.vn
  description: Production
security:
- bearerAuth: []
tags:
- name: Auth
  description: EPIC 1 — Xác thực và phiên làm việc
- name: Users
  description: EPIC 2 — Quản lý người dùng
- name: Weather Sources
  description: EPIC 3/5 — Nguồn dữ liệu thời tiết
- name: Ports
  description: EPIC 3 — Quản lý cảng biển
- name: Zones
  description: EPIC 4 — Quản lý khu vực
- name: Port Contacts
  description: EPIC 3 — Danh bạ liên hệ cảng
- name: Weather
  description: EPIC 5 — Dữ liệu thời tiết
- name: Risk
  description: EPIC 6 — Risk Engine
- name: SOP Rules
  description: EPIC 7 — Quản lý SOP rules
- name: SOP Executions
  description: EPIC 7 — Lịch sử thực thi SOP
- name: Operation Mode
  description: EPIC 8 — Trạng thái vận hành
- name: Task Logs
  description: EPIC 10 — Task auto-generation
- name: Alerts
  description: EPIC 11 — Cảnh báo và thông báo
- name: Operation Events
  description: EPIC 12 — Audit trail
- name: Simulation
  description: EPIC 15 — Chế độ mô phỏng
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (TTL 15 phút). Lấy từ POST /api/auth/login
  parameters:
    portIdQuery:
      name: portId
      in: query
      required: true
      schema:
        type: string
        format: uuid
      description: UUID của cảng
    portIdPath:
      name: portId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    fromQuery:
      name: from
      in: query
      schema:
        type: string
        format: date-time
      description: Từ thời điểm (ISO 8601, UTC)
    toQuery:
      name: to
      in: query
      schema:
        type: string
        format: date-time
      description: Đến thời điểm (ISO 8601, UTC)
    pageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    pageSizeQuery:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  responses:
    Unauthorized:
      description: Token thiếu, hết hạn hoặc không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Token is missing or invalid
    Forbidden:
      description: Không đủ quyền hạn (role không phù hợp hoặc sai port)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Insufficient permissions for this resource
    NotFound:
      description: Resource không tồn tại
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Resource not found
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    MethodNotAllowed:
      description: HTTP method không được phép (dùng cho APPEND-ONLY resources)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: METHOD_NOT_ALLOWED
            message: This resource is append-only
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Resource not found
        details:
          type: string
          nullable: true
    ValidationErrorResponse:
      type: object
      required:
      - code
      - message
      - errors
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Input validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email format
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    RiskLevel:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    OperationMode:
      type: string
      enum:
      - NORMAL
      - LIMITED
      - STOP
    ZoneType:
      type: string
      enum:
      - DOCK
      - YARD
      - GATE
      - WAREHOUSE
    UserRole:
      type: string
      enum:
      - ADMIN
      - COMPANY_ADMIN
      - OPERATOR
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - SUSPENDED
    AlertSeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - CRITICAL
    WeatherFactor:
      type: string
      enum:
      - WIND
      - RAIN
      - VISIBILITY
      - WAVE
    SopActionType:
      type: string
      enum:
      - STOP_LOADING
      - LIMIT_VESSEL_ENTRY
      - EVACUATE_EQUIPMENT
      - CLOSE_GATE
      - EMERGENCY_SHUTDOWN
      - NOTIFY_AUTHORITY
      - CUSTOM
    FetchJobStatus:
      type: string
      enum:
      - PENDING
      - RUNNING
      - SUCCESS
      - FAILED
      - SKIPPED
    ExecutionStatus:
      type: string
      enum:
      - TRIGGERED
      - COMPLETED
      - FAILED
      - SKIPPED
    ContactRole:
      type: string
      enum:
      - PORT_MANAGER
      - SAFETY_OFFICER
      - OPERATIONS_LEAD
      - AUTHORITY
      - EMERGENCY
    EventType:
      type: string
      enum:
      - WEATHER_FETCHED
      - RISK_ASSESSED
      - RISK_LEVEL_CHANGED
      - SOP_TRIGGERED
      - SOP_EXECUTED
      - MODE_CHANGED
      - MODE_OVERRIDDEN
      - TASK_CREATED
      - ALERT_CREATED
      - ALERT_READ
      - THRESHOLD_UPDATED
      - SOP_RULE_UPDATED
      - SIMULATION_STARTED
      - SIMULATION_ENDED
      - USER_LOGIN
      - USER_LOGOUT
      - PASSWORD_RESET
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: operator@porms.vn
        password:
          type: string
          format: password
          example: Secure@2026!
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (TTL 15 phút)
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 900
          description: Seconds
        user:
          $ref: '#/components/schemas/UserProfile'
    RefreshRequest:
      type: object
      description: Refresh token được đọc từ httpOnly cookie tự động. Body trống.
      properties: {}
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: user@porms.vn
    ResetPasswordRequest:
      type: object
      required:
      - token
      - newPassword
      - confirmPassword
      properties:
        token:
          type: string
          description: Raw token từ reset link
        newPassword:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      - confirmPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
        confirmPassword:
          type: string
          format: password
    SessionInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceInfo:
          type: object
          properties:
            userAgent:
              type: string
            ipAddress:
              type: string
            platform:
              type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        isCurrent:
          type: boolean
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        assignedPortId:
          type: string
          format: uuid
          nullable: true
        assignedPortName:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required:
      - email
      - fullName
      - role
      - password
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        assignedPortId:
          type: string
          format: uuid
          nullable: true
          description: Bắt buộc cho COMPANY_ADMIN và OPERATOR. NULL cho ADMIN.
        phoneNumber:
          type: string
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        assignedPortId:
          type: string
          format: uuid
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 255
        phoneNumber:
          type: string
          nullable: true
    AdminResetPasswordRequest:
      type: object
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8
    WeatherSource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceName:
          type: string
          example: OpenWeatherMap
        sourceType:
          type: string
          enum:
          - REST_JSON
          - MANUAL_INPUT
        apiBaseUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        recommendedFetchIntervalMin:
          type: integer
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CreateWeatherSourceRequest:
      type: object
      required:
      - sourceName
      - sourceType
      properties:
        sourceName:
          type: string
        sourceType:
          type: string
          enum:
          - REST_JSON
          - MANUAL_INPUT
        apiBaseUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        recommendedFetchIntervalMin:
          type: integer
          nullable: true
    Port:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Cảng Tiên Sa — Đà Nẵng
        code:
          type: string
          example: DNTSA
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          example: 16.1051
        longitude:
          type: number
          format: double
          example: 108.2338
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        currentMode:
          $ref: '#/components/schemas/OperationMode'
        currentRiskLevel:
          $ref: '#/components/schemas/RiskLevel'
        defaultWeatherSourceId:
          type: string
          format: uuid
          nullable: true
        owStationId:
          type: string
          nullable: true
        isActive:
          type: boolean
        zoneCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PortStatus:
      type: object
      description: Snapshot real-time từ view v_port_current_state
      properties:
        portId:
          type: string
          format: uuid
        portName:
          type: string
        portCode:
          type: string
        currentMode:
          $ref: '#/components/schemas/OperationMode'
        currentRiskLevel:
          $ref: '#/components/schemas/RiskLevel'
        unreadAlertCount:
          type: integer
        assessmentSummary:
          type: string
          nullable: true
        lastAssessedAt:
          type: string
          format: date-time
          nullable: true
        weather:
          $ref: '#/components/schemas/WeatherSnapshot'
    CreatePortRequest:
      type: object
      required:
      - name
      - code
      - latitude
      - longitude
      properties:
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 20
          pattern: ^[A-Z0-9]+$
        address:
          type: string
          nullable: true
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          default: Asia/Ho_Chi_Minh
        owStationId:
          type: string
          nullable: true
        defaultWeatherSourceId:
          type: string
          format: uuid
          nullable: true
    UpdatePortRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        address:
          type: string
          nullable: true
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
        owStationId:
          type: string
          nullable: true
        isActive:
          type: boolean
    Zone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        portId:
          type: string
          format: uuid
        name:
          type: string
        zoneType:
          $ref: '#/components/schemas/ZoneType'
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        config:
          type: object
          description: 'JSONB: {warning_text, priority, enabled}'
        currentRiskLevel:
          $ref: '#/components/schemas/RiskLevel'
        displayOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ZoneStatus:
      type: object
      properties:
        zone:
          $ref: '#/components/schemas/Zone'
        activeRestrictions:
          type: array
          items:
            type: object
            properties:
              actionType:
                $ref: '#/components/schemas/SopActionType'
              actionDescription:
                type: string
              severity:
                $ref: '#/components/schemas/AlertSeverity'
    CreateZoneRequest:
      type: object
      required:
      - name
      - zoneType
      properties:
        name:
          type: string
          maxLength: 255
        zoneType:
          $ref: '#/components/schemas/ZoneType'
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          nullable: true
          minimum: 1
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        displayOrder:
          type: integer
          default: 0
    UpdateZoneRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        displayOrder:
          type: integer
        isActive:
          type: boolean
        config:
          type: object
    ZoneThresholdOverride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        factor:
          $ref: '#/components/schemas/WeatherFactor'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        minValue:
          type: number
        maxValue:
          type: number
          nullable: true
        unit:
          type: string
        reason:
          type: string
        isActive:
          type: boolean
        updatedByUserId:
          type: string
          format: uuid
          nullable: true
        updatedAt:
          type: string
          format: date-time
    CreateZoneThresholdOverrideRequest:
      type: object
      required:
      - factor
      - riskLevel
      - minValue
      - unit
      - reason
      properties:
        factor:
          $ref: '#/components/schemas/WeatherFactor'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        minValue:
          type: number
        maxValue:
          type: number
          nullable: true
        unit:
          type: string
        reason:
          type: string
          minLength: 20
    PortContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        portId:
          type: string
          format: uuid
        contactRole:
          $ref: '#/components/schemas/ContactRole'
        fullName:
          type: string
        title:
          type: string
          nullable: true
        phonePrimary:
          type: string
        phoneSecondary:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        receiveAlerts:
          type: boolean
        alertThreshold:
          $ref: '#/components/schemas/RiskLevel'
        isActive:
          type: boolean
    CreatePortContactRequest:
      type: object
      required:
      - contactRole
      - fullName
      - phonePrimary
      properties:
        contactRole:
          $ref: '#/components/schemas/ContactRole'
        fullName:
          type: string
        title:
          type: string
          nullable: true
        phonePrimary:
          type: string
        phoneSecondary:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        receiveAlerts:
          type: boolean
          default: false
        alertThreshold:
          $ref: '#/components/schemas/RiskLevel'
    WeatherReading:
      type: object
      properties:
        id:
          type: string
          format: uuid
        portId:
          type: string
          format: uuid
        windSpeedMs:
          type: number
          format: double
        beaufortNumber:
          type: integer
          minimum: 0
          maximum: 12
        windDirectionDeg:
          type: integer
          nullable: true
        windGustMs:
          type: number
          nullable: true
        rainfall1hMm:
          type: number
          nullable: true
        rainfall3hMm:
          type: number
          nullable: true
        temperatureC:
          type: number
          nullable: true
        humidityPct:
          type: integer
          nullable: true
        visibilityKm:
          type: number
          nullable: true
        pressureHpa:
          type: number
          nullable: true
        owWeatherCode:
          type: integer
          nullable: true
        owWeatherDesc:
          type: string
          nullable: true
        owWeatherIcon:
          type: string
          nullable: true
          example: 10d
        observedAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        dataSource:
          type: string
          example: OPENWEATHER_API
        isSimulation:
          type: boolean
    WeatherSnapshot:
      type: object
      description: Subset của WeatherReading cho dashboard
      properties:
        windSpeedMs:
          type: number
        beaufortNumber:
          type: integer
        rainfall1hMm:
          type: number
          nullable: true
        temperatureC:
          type: number
          nullable: true
        humidityPct:
          type: integer
          nullable: true
        visibilityKm:
          type: number
          nullable: true
        owWeatherDesc:
          type: string
          nullable: true
        owWeatherIcon:
          type: string
          nullable: true
        observedAt:
          type: string
          format: date-time
    ManualWeatherInputRequest:
      type: object
      required:
      - portId
      - windSpeedMs
      - observedAt
      properties:
        portId:
          type: string
          format: uuid
        windSpeedMs:
          type: number
          minimum: 0
        rainfall1hMm:
          type: number
          minimum: 0
          default: 0
        visibilityKm:
          type: number
          nullable: true
        temperatureC:
          type: number
          nullable: true
        humidityPct:
          type: integer
          nullable: true
        observedAt:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
    FetchJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        portId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/FetchJobStatus'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        responseTimeMs:
          type: integer
          nullable: true
        httpStatusCode:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdReadingId:
          type: string
          format: uuid
          nullable: true
        prefectFlowRunId:
          type: string
          nullable: true
    FetchHealth:
      type: object
      properties:
        portId:
          type: string
          format: uuid
        successRate24h:
          type: number
          format: double
          description: '% thành công trong 24h'
        lastSuccessfulFetchAt:
          type: string
          format: date-time
          nullable: true
        consecutiveFailures:
          type: integer
        totalFetches24h:
          type: integer
        recentJobs:
          type: array
          items:
            $ref: '#/components/schemas/FetchJob'
    RiskThreshold:
      type: object
      properties:
        id:
          type: string
          format: uuid
        factor:
          $ref: '#/components/schemas/WeatherFactor'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        minValue:
          type: number
        maxValue:
          type: number
          nullable: true
        unit:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        updatedByUserId:
          type: string
          format: uuid
          nullable: true
        updatedAt:
          type: string
          format: date-time
    UpdateRiskThresholdRequest:
      type: object
      required:
      - minValue
      properties:
        minValue:
          type: number
