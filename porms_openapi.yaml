paths:
  /api/auth/login:
    post:
      summary: Đăng nhập hệ thống
      description: |-
        Xác thực user bằng email và password.

        - Trả `accessToken` trong response body (TTL 15 phút)
        - Trả `refreshToken` qua httpOnly cookie (TTL 7 ngày)
        - Khóa tài khoản 15 phút sau 5 lần sai liên tiếp

        **Roles:** Public (không cần auth)
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Sai email/password — lỗi generic không tiết lộ field nào sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_CREDENTIALS
                message: Email hoặc mật khẩu không đúng
        '423':
          description: Tài khoản bị khóa tạm thời
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ACCOUNT_LOCKED
                message: Tài khoản bị khóa 15 phút do đăng nhập sai nhiều lần
  /api/auth/refresh:
    post:
      summary: Làm mới access token
      description: |-
        Phát access token mới từ refresh token hợp lệ trong httpOnly cookie.

        Frontend tự động gọi khi nhận 401 từ API khác.

        **Roles:** Public (dùng refresh token từ cookie)
      tags:
      - Auth
      security: []
      responses:
        '200':
          description: Token mới đã được phát
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token hết hạn, đã revoke hoặc không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      summary: Đăng xuất thiết bị hiện tại
      description: |-
        Revoke refresh token của thiết bị hiện tại. Clear httpOnly cookie.

        **Roles:** Tất cả roles đã đăng nhập
      tags:
      - Auth
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout-all:
    post:
      summary: Đăng xuất tất cả thiết bị
      description: |-
        Revoke toàn bộ refresh tokens của user hiện tại.

        **Roles:** Tất cả roles đã đăng nhập
      tags:
      - Auth
      responses:
        '204':
          description: Đã revoke tất cả phiên đăng nhập
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/forgot-password:
    post:
      summary: Yêu cầu đặt lại mật khẩu
      description: |-
        Gửi email chứa reset link nếu email tồn tại.

        Luôn trả 200 (generic message) để không tiết lộ email có tồn tại hay không.

        Rate limit: 3 requests / 30 phút / email.

        **Roles:** Public
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Response generic — không tiết lộ email có tồn tại không
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Nếu email tồn tại, chúng tôi đã gửi hướng dẫn đặt lại mật khẩu.
        '429':
          description: Rate limit exceeded
  /api/auth/reset-password:
    post:
      summary: Đặt lại mật khẩu với token
      description: |-
        Validate token từ email và đặt mật khẩu mới.

        - Token one-time use, TTL 15 phút
        - Sau reset: revoke tất cả refresh tokens

        **Roles:** Public
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Mật khẩu đã được đặt lại thành công
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          description: Token hết hạn hoặc đã được sử dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: TOKEN_EXPIRED
                message: Reset token đã hết hạn hoặc đã dùng
  /api/auth/change-password:
    put:
      summary: Đổi mật khẩu (đã đăng nhập)
      description: |-
        Đổi mật khẩu sau khi xác minh mật khẩu hiện tại. Sau đổi: revoke tất cả refresh tokens.

        **Roles:** Tất cả roles đã đăng nhập
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Mật khẩu đã được đổi. Yêu cầu đăng nhập lại trên tất cả thiết bị.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Mật khẩu hiện tại không đúng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/sessions:
    get:
      summary: Xem phiên đăng nhập của bản thân
      description: |-
        Xem tất cả refresh tokens còn hiệu lực của user hiện tại.

        **Roles:** Tất cả roles đã đăng nhập
      tags:
      - Auth
      responses:
        '200':
          description: Danh sách phiên đăng nhập
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/sessions/{id}:
    delete:
      summary: Revoke phiên đăng nhập cụ thể
      description: |-
        Đăng xuất một thiết bị cụ thể. Chỉ revoke token của bản thân.

        **Roles:** Tất cả roles đã đăng nhập
      tags:
      - Auth
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Phiên đã bị revoke
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users:
    get:
      summary: Danh sách tất cả users
      description: '**Roles:** ADMIN only'
      tags:
      - Users
      parameters:
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - ADMIN
          - COMPANY_ADMIN
          - OPERATOR
        description: Filter theo role
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
        description: Filter theo status
      - name: assignedPortId
        in: query
        required: false
        schema:
          type: string
        description: Filter theo port UUID
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Tìm theo email hoặc full_name
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: ''
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: ''
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Tạo tài khoản người dùng mới
      description: '**Roles:** ADMIN only'
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email đã tồn tại trong hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: EMAIL_ALREADY_EXISTS
                message: Email này đã được sử dụng
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/me:
    get:
      summary: Xem profile cá nhân
      description: '**Roles:** Tất cả roles'
      tags:
