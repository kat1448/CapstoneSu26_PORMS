        '404':
          $ref: '#/components/responses/NotFound'
  /api/simulation/{sessionId}/results:
    get:
      summary: Kết quả tổng kết sau khi simulation hoàn thành
      description: |-
        Chỉ available khi session status = COMPLETED.

        **Roles:** ADMIN, COMPANY_ADMIN
      tags:
      - Simulation
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResults'
        '404':
          description: Session không tồn tại hoặc chưa hoàn thành
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/simulation/sessions:
    get:
      summary: Lịch sử simulation sessions
      description: '**Roles:** ADMIN, COMPANY_ADMIN'
      tags:
      - Simulation
      parameters:
      - name: portId
        in: query
        required: true
        schema:
          type: string
        description: ''
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - CANCELLED
        description: ''
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: ''
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimulationSession'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
